<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>咕咕嘎嘎 · 旅行日记</title>
  <link rel="stylesheet" href="style.css?v=20261104y">
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <h1 class="site-title">咕咕嘎嘎</h1>
      <p class="site-subtitle">记录每一段在路上</p>
    </div>
    <span id="portal-user" class="user-area" hidden></span>
  </header>

  <main class="layout">
    <section class="panel day-panel">
      <div class="day-head">
        <h2 id="day-title" class="panel-heading">点击日历上的日期,查看当天动态</h2>
        <div class="day-nav" id="day-nav" hidden>
          <button type="button" id="day-prev" class="day-nav-btn" aria-label="前一天">‹</button>
          <button type="button" id="day-next" class="day-nav-btn" aria-label="后一天">›</button>
        </div>
      </div>
      <div class="panel-tabs" id="panel-tabs">
        <button type="button" class="tab-btn active" data-tab="entries">当日动态</button>
        <button type="button" class="tab-btn" data-tab="todos">当日待办</button>
        <button type="button" class="tab-btn" data-tab="reading">当日在读</button>
        <button type="button" class="tab-btn" data-tab="activity">当日运动</button>
      </div>
      <div id="tab-todos" class="tab-pane" hidden>
        <div id="day-todos" class="todo-section" hidden></div>
      </div>
      <div id="tab-entries" class="tab-pane">
        <!-- tab 已经写明「当日动态」,这里不再重复标题;只留「记一把」入口 -->
        <div class="day-head-actions" id="day-head-actions"><a id="btn-entry-add" class="btn-add-entry" href="edit.html" hidden>记一把</a></div>
        <div id="day-entries" class="entries"></div>
      </div>
      <!-- 当日在读:微信读书每日总结(数据由播报脚本推送,前端只读;跟随所选日期) -->
      <div id="tab-reading" class="tab-pane" hidden>
        <div class="pane-actions" id="rd-actions" hidden><button type="button" class="btn-add-entry" id="rm-add-top">记一本</button></div>
        <div id="reading-body" class="reading-body"></div>
      </div>
      <!-- 当日运动:COROS 同步的运动记录(同样由外部脚本推送;跟随所选日期) -->
      <div id="tab-activity" class="tab-pane" hidden>
        <div class="pane-actions" id="ac-actions" hidden><button type="button" class="btn-add-entry" id="am-add-top">记一次</button></div>
        <div id="activity-body" class="activity-body"></div>
      </div>
    </section>

    <section class="panel calendar-panel">
      <div class="cal-nav">
        <button id="cal-prev" class="cal-btn" aria-label="上个月">‹</button>
        <h2 id="cal-title"></h2>
        <button id="cal-next" class="cal-btn" aria-label="下个月">›</button>
      </div>
      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
    </section>
  </main>

  <footer class="site-footer">咕咕嘎嘎 · 记录每一段在路上</footer>

  <div id="lightbox" class="lightbox" aria-hidden="true"><img alt="查看大图"></div>
  <div id="preview-modal" class="modal" hidden>
    <div class="modal-card">
      <div id="preview-body"></div>
      <button type="button" id="btn-preview-close" class="btn-small">关闭</button>
    </div>
  </div>

  <!-- 记一次:手动添加运动记录(COROS 没记到的) -->
  <div id="act-modal" class="ckin-modal" hidden>
    <div class="ckin-box">
      <div class="ckin-head"><span id="am-head">记一次</span><button type="button" id="am-close" class="ckin-x" aria-label="关闭">✕</button></div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label">运动</label>
        <div id="am-kinds" class="chip-row"></div>
      </div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="am-name">名称</label>
        <input id="am-name" maxlength="30" placeholder="跑步 / 骑行 / 羽毛球…">
      </div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="am-minutes">时长</label>
        <input id="am-minutes" type="number" min="0" max="1440" placeholder="分钟">
      </div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="am-dist">距离</label>
        <input id="am-dist" type="number" min="0" step="0.1" placeholder="公里（可空）">
      </div>
      <div class="rm-save-row">
        <button type="button" id="am-save" class="rm-save-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 记一本:手动添加阅读记录(微信读书之外的书/纸质书) -->
  <div id="read-modal" class="ckin-modal" hidden>
    <div class="ckin-box">
      <div class="ckin-head"><span id="rm-head">记一本</span><button type="button" id="rm-close" class="ckin-x" aria-label="关闭">✕</button></div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="rm-title">书名</label>
        <input id="rm-title" maxlength="100" placeholder="必填">
      </div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="rm-author">作者</label>
        <input id="rm-author" maxlength="50" placeholder="可选">
      </div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="rm-minutes">时长</label>
        <input id="rm-minutes" type="number" min="0" max="1440" placeholder="分钟">
      </div>
      <textarea id="rm-summary" rows="4" maxlength="2000" placeholder="摘要 / 感想（可选）"></textarea>
      <div class="rm-file-row">
        <label class="rm-file-btn" for="rm-photos">+ 图片</label>
        <input id="rm-photos" type="file" accept="image/*" multiple hidden>
        <span id="rm-file-count" class="rm-file-count"></span>
      </div>
      <div class="rm-save-row">
        <button type="button" id="rm-save" class="rm-save-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 日记弹窗(新建/编辑普通条目,「记一把」与编辑入口共用;打卡弹窗同款) -->
  <div id="entry-modal" class="ckin-modal" hidden>
    <div class="ckin-box">
      <div class="ckin-head"><span id="em-title">写日记</span><button type="button" id="em-close" class="ckin-x" aria-label="关闭">✕</button></div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="em-date">日期</label>
        <input type="date" id="em-date">
      </div>
      <input type="text" id="em-title-input" maxlength="200" placeholder="标题(可选)">
      <textarea id="em-text" maxlength="5000" rows="5" placeholder="正文"></textarea>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="em-vis">可见性</label>
        <select id="em-vis">
          <option value="public" selected>公开</option>
          <option value="private">私有</option>
        </select>
      </div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label">专辑</label>
        <div id="em-album" class="chip-row" role="radiogroup" aria-label="专辑"></div>
      </div>
      <div class="ckin-loc-row">
        <input id="em-loc" maxlength="80" placeholder="地点(可选)">
        <button type="button" id="em-locate" class="ckin-icon-btn" title="用当前位置" aria-label="用当前位置">📍</button>
        <button type="button" id="em-map" class="ckin-icon-btn" title="地图选点" aria-label="地图选点">🗺️</button>
      </div>
      <div class="ckin-photos" id="em-photos">
        <label class="ckin-add" for="em-files">+ 照片(可选,≤20 张)</label>
        <input type="file" id="em-files" accept="image/*" multiple hidden>
      </div>
      <div id="em-existing" class="ckin-existing" hidden></div>
      <div id="em-new-preview" class="ckin-new-preview" hidden></div>
      <div class="ckin-actions">
        <button type="button" id="em-save" class="btn-small">发布</button>
      </div>
      <div id="em-status" class="form-status"></div>
    </div>
  </div>

  <!-- 打卡弹窗(勾选待办时;照片/定位/备注均可选填) -->
  <div id="ckin-modal" class="ckin-modal" hidden>
    <div class="ckin-box">
      <div class="ckin-head"><span id="ckin-title">打卡</span><button type="button" id="ckin-del-record" class="btn-small btn-danger" hidden>删除打卡</button></div>
      <div class="ckin-todo" id="ckin-todo"></div>
      <input type="text" id="ckin-title-input" maxlength="200" placeholder="待办标题" hidden>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="ckin-album">专辑</label>
        <select id="ckin-album" class="ckin-album">
          <option value="">不设专辑</option>
          <option value="__new__">➕ 新建专辑…</option>
        </select>
      </div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="ckin-vis">可见性</label>
        <select id="ckin-vis">
          <option value="public" selected>公开</option>
          <option value="private">私有</option>
        </select>
      </div>
      <textarea id="ckin-note" maxlength="5000" rows="2" placeholder="备注(可选)"></textarea>
      <div class="ckin-photos" id="ckin-photos">
        <label class="ckin-add" for="ckin-files">+ 照片(可选,≤9 张)</label>
        <input type="file" id="ckin-files" accept="image/*" multiple hidden>
      </div>
      <div id="ckin-existing" class="ckin-existing" hidden></div>
      <div class="ckin-loc-row">
        <input id="ckin-loc" maxlength="80" placeholder="定位(可选,如:橘子洲)">
        <button type="button" id="ckin-locate" class="btn-small" title="自动定位">📍 定位</button>
        <button type="button" id="ckin-map" class="btn-small" title="地图选点">🗺️ 地图</button>
      </div>
      <div class="ckin-actions">
        <button type="button" id="ckin-save" class="btn-small">保存打卡</button>
      </div>
      <div id="ckin-status" class="form-status"></div>
    </div>
  </div>

    <script src="api.js?v=20260825"></script>
    <script src="photo.js?v=20260917a"></script>
  <script src="map-common.js?v=20261030a"></script>
  <script src="loc-picker.js?v=20261102f"></script>
  <script src="entry-modal.js?v=20261102e"></script>
  <script src="pull-refresh.js?v=20261102d"></script>
  <script src="app.js?v=20261104t"></script>
  <script src="reading.js?v=20261105c"></script>
  <script src="activity.js?v=20261104z"></script>
</body>
</html>
