<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写日记 · 咕咕嘎嘎</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <h1 class="site-title"><a href="/">咕咕嘎嘎</a></h1>
      <p class="site-subtitle">写日记</p>
    </div>
  </header>

  <main class="layout">
    <form id="diary-form" class="panel upload-form">
      <label>
        日期
        <input type="date" id="f-date" required>
      </label>
      <label>
        上传人
        <select id="f-author">
          <option value="球">球</option>
          <option value="小红">小红</option>
        </select>
      </label>

      <label>
        地点(可选)
        <div class="loc-row">
          <input type="text" id="f-location" placeholder="点「选位置」选地点" readonly>
          <button type="button" id="btn-loc" class="btn-small">🗺️ 选位置</button>
        </div>
        <input type="hidden" id="f-lat">
        <input type="hidden" id="f-lng">
      </label>

      <!-- 全屏选点器(搜索优先,微信/高德式) -->
      <div id="loc-overlay" class="loc-overlay" hidden>
        <div class="loc-overlay-card">
          <div class="loc-overlay-head">
            <span class="loc-overlay-title">选择位置</span>
            <button type="button" id="btn-loc-close" class="btn-small">✕</button>
          </div>
          <div class="loc-search-row">
            <input type="search" id="loc-search" placeholder="搜索地名/店铺,如:橘子洲" autocomplete="off" enterkeyhint="search">
            <button type="button" id="btn-loc-current" class="btn-small">📍 定位</button>
          </div>
          <div id="loc-results" class="loc-results"></div>
          <div id="loc-map" class="loc-map"></div>
          <div id="loc-confirm" class="loc-confirm" hidden>
            <span id="loc-confirm-name" class="loc-confirm-name"></span>
            <button type="button" id="btn-loc-done" class="btn-small">确定选这个点</button>
          </div>
          <div id="loc-nearby" class="loc-nearby" hidden></div>
          <p id="loc-status" class="form-status"></p>
        </div>
      </div>

      <label>
        专辑(可选)
        <input type="text" id="f-album" list="album-list">
        <datalist id="album-list"></datalist>
      </label>

      <label>
        标题
        <input type="text" id="f-title" placeholder="今天去了哪?">
      </label>

      <label>
        文字
        <textarea id="f-text" rows="5" placeholder="记点什么吧..."></textarea>
      </label>

      <label>
        照片(可多选,自动压缩;同一张照片同一天只能传一次)
        <input type="file" id="f-photos" accept="image/*" multiple>
      </label>

      <div id="edit-photos" class="edit-photos" hidden></div>
      <div id="photo-preview" class="photo-preview"></div>
      <p id="form-status" class="form-status"></p>

      <div id="success-banner" class="success-banner" hidden>
        ✅ 上传成功!
        <div class="success-actions">
          <a id="btn-view-day" class="btn-small" href="/">查看当天</a>
          <button type="button" id="btn-again" class="btn-small">继续写</button>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="btn-submit" class="btn-submit">发布</button>
        <button type="button" id="btn-cancel-edit" class="btn-small" hidden>取消编辑</button>
      </div>
    </form>

    <section class="panel manage-panel">
      <h2 class="panel-heading">管理条目</h2>
      <p class="manage-hint">预览 / 编辑 / 删除(删除需口令)</p>
      <div id="recent-list" class="recent-list"></div>
    </section>

    <section class="panel export-panel">
      <h2 class="panel-heading">导出行程</h2>
      <p class="manage-hint">选一个日期区间,生成总览 + 地图路线分享页</p>
      <div class="export-form">
        <label>
          起始日期
          <input type="date" id="ex-from">
        </label>
        <label>
          结束日期
          <input type="date" id="ex-to">
        </label>
        <button type="button" id="btn-export" class="btn-submit">生成分享页</button>
      </div>
      <p id="export-status" class="form-status"></p>
    </section>
  </main>

  <!-- 预览弹层 -->
  <div id="preview-modal" class="modal" hidden>
    <div class="modal-card">
      <div id="preview-body"></div>
      <button type="button" id="btn-preview-close" class="btn-small">关闭</button>
    </div>
  </div>

  <footer class="site-footer">咕咕嘎嘎 · 记录每一段在路上</footer>

  <script src="upload.js"></script>
</body>
</html>
