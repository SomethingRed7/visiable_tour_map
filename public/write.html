<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理 · 咕咕嘎嘎</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 管理界面正文总体不加粗;标题与主页保持一致(site-title=800、panel-heading=700 用全局样式) */
    .write-page .login-hint a,
    .write-page .user-name,
    .write-page .manage-hint { font-weight: 400; }
  </style>
</head>
<body class="write-page">
  <header class="site-header">
    <div class="header-main">
      <h1 class="site-title"><a href="/">咕咕嘎嘎</a></h1>
      <p class="site-subtitle">管理</p>
    </div>
    <div id="user-area" class="user-area" hidden>
      <span id="current-user" class="user-name"></span>
      <button type="button" id="btn-logout" class="btn-small">退出登录</button>
    </div>
  </header>

  <main class="layout">
    <!-- 登录(未登录时显示;两步:你是谁 → 密码) -->
    <section id="login-panel" class="panel">
      <h2 class="panel-heading">登录</h2>
      <form id="who-form" class="upload-form">
        <label>
          你是?
          <input type="text" id="who-user" autocomplete="username" placeholder="输入你的名字" required>
        </label>
        <p id="who-status" class="form-status"></p>
        <button type="submit" class="btn-submit">下一步</button>
      </form>
      <form id="login-form" class="upload-form" hidden>
        <p class="who-echo">你是 <strong id="lg-echo"></strong><a href="#" id="lg-change">(换个人)</a></p>
        <label>
          密码
          <input type="password" id="lg-pass" autocomplete="current-password" required>
        </label>
        <p id="login-status" class="form-status"></p>
        <button type="submit" class="btn-submit">登录</button>
        <p class="login-hint">初次使用?<a href="#" id="lg-to-setup">设置你的密码</a></p>
      </form>
      <form id="setup-form" class="upload-form" hidden>
        <p class="manage-hint">首次使用:输入管理员发给你的一次性设置码,设置你自己的密码(至少 8 位)</p>
        <label>
          用户名
          <input type="text" id="st-user" autocomplete="username" required>
        </label>
        <label>
          一次性设置码
          <input type="text" id="st-code" inputmode="numeric" autocomplete="one-time-code" required>
        </label>
        <label>
          新密码(至少 8 位)
          <input type="password" id="st-pass" minlength="8" autocomplete="new-password" required>
        </label>
        <label>
          确认密码
          <input type="password" id="st-pass2" minlength="8" autocomplete="new-password" required>
        </label>
        <p id="setup-status" class="form-status"></p>
        <button type="submit" class="btn-submit">设置密码并登录</button>
        <p><a href="#" id="lg-back">← 返回登录</a></p>
      </form>
    </section>

    <!-- 管理区(登录后可见) -->
    <div id="editor-area" hidden>
      <section class="panel export-panel">
        <h2 class="panel-heading">导出行程</h2>
        <p class="manage-hint">按专辑或日期区间导出,可叠加;留空 = 全部</p>
        <div class="export-form">
          <label>
            专辑
            <select id="ex-album">
              <option value="">全部专辑</option>
            </select>
          </label>
          <label>
            起始日期
            <input type="date" id="ex-from">
          </label>
          <label>
            结束日期
            <input type="date" id="ex-to">
          </label>
          <button type="button" id="btn-export" class="btn-submit">生成分享页</button>
        </div>
        <p id="export-status" class="form-status"></p>
      </section>

      <section class="panel share-panel">
        <h2 class="panel-heading">已分享的快照</h2>
        <p class="manage-hint">快照是生成那一刻冻结的内容;「更新」用最新数据重新生成,链接和二维码不变;「删除」后链接立即失效</p>
        <div id="share-list" class="recent-list"></div>
      </section>

      <section class="panel manage-panel">
        <h2 class="panel-heading">管理条目</h2>
        <p class="manage-hint">预览 / 编辑 / 删除</p>
        <a id="btn-write" class="btn-submit write-btn" href="/edit">✏️ 写日记</a>
        <h3 class="sub-panel-heading">打卡记录</h3>
        <div id="ckin-list" class="recent-list"></div>
        <h3 class="sub-panel-heading">日记条目</h3>
        <div id="recent-list" class="recent-list"></div>
      </section>
    </div>
  </main>

  <!-- 日记弹窗(编辑普通条目;打卡弹窗同款) -->
  <div id="entry-modal" class="ckin-modal" hidden>
    <div class="ckin-box">
      <div class="ckin-head"><span id="em-title">编辑日记</span><button type="button" id="em-close" class="btn-small">✕</button></div>
      <label class="ckin-vis-label" for="em-date">日期</label>
      <input type="date" id="em-date">
      <input type="text" id="em-title-input" maxlength="200" placeholder="标题(可选)">
      <textarea id="em-text" maxlength="5000" rows="4" placeholder="正文"></textarea>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="em-vis">可见性</label>
        <select id="em-vis">
          <option value="public" selected>公开</option>
          <option value="private">私有</option>
        </select>
      </div>
      <div class="ckin-vis-row">
        <label class="ckin-vis-label" for="em-album">专辑</label>
        <select id="em-album">
          <option value="">不设专辑</option>
          <option value="__new__">➕ 新建专辑…</option>
        </select>
      </div>
      <div class="ckin-loc-row">
        <input id="em-loc" maxlength="80" placeholder="地点(可选)">
        <button type="button" id="em-locate" class="btn-small" title="自动定位">📍 定位</button>
        <button type="button" id="em-map" class="btn-small" title="地图选点">🗺️ 地图</button>
      </div>
      <div class="ckin-photos" id="em-photos">
        <label class="ckin-add" for="em-files">+ 照片(可选,≤20 张)</label>
        <input type="file" id="em-files" accept="image/*" multiple hidden>
      </div>
      <div id="em-existing" class="ckin-existing" hidden></div>
      <div id="em-new-preview" class="ckin-new-preview" hidden></div>
      <div class="ckin-actions">
        <button type="button" id="em-save" class="btn-small">保存修改</button>
      </div>
      <div id="em-status" class="form-status"></div>
    </div>
  </div>

  <!-- 预览弹层 -->
  <div id="preview-modal" class="modal" hidden>
    <div class="modal-card">
      <div id="preview-body"></div>
      <button type="button" id="btn-preview-close" class="btn-small">关闭</button>
    </div>
  </div>

  <footer class="site-footer">咕咕嘎嘎 · 记录每一段在路上</footer>

  <script src="loc-picker.js"></script>
  <script src="entry-modal.js"></script>
  <script src="upload.js"></script>
</body>
</html>
