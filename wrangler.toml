name = "gugugaga"
compatibility_date = "2026-08-10"
pages_build_output_dir = "public"

# 真实绑定:KV id 来自 `wrangler kv namespace create`;R2 bucket 需先在 dashboard 启用
[[kv_namespaces]]
binding = "ENTRIES"
id = "73d4fb83273a49be907778313fa23164"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gugugaga-photos"

# 登录白名单(逗号分隔;密码不预置,首次登录凭一次性设置码自助设置,哈希存 D1 users 表)
[vars]
USERS = "球,小红"
SESSION_SECRET = "cfef4e321f670a2026dcd0fcea5ff1396b84a18af981b09e"
# 高德开放平台 key(定位/地理编码;留空=纯浏览器定位+OSM 回退)
# AMAP_KEY = Web端(JS API)key —— 前端定位/搜索/反查(AMap.Geolocation/PlaceSearch/Geocoder),白名单 gugugaga-viw.pages.dev
# AMAP_SECURITY = 同 key 的「安全密钥」(securityJsCode)——2021 后 JS API 服务必须,缺了报 INVALID_USER_SCODE
# AMAP_WEB_KEY = Web服务 key —— 服务端 regeo(restapi.amap.com),无需白名单
AMAP_KEY = "c89c48432f7c8a0f2408cffc4a535d15"
AMAP_SECURITY = "5aaffe1e328474981800c46a0e5bdc90"
AMAP_WEB_KEY = "69998348ddc40d7d814ca8eb34ca17b0"
# 播报接口密钥(serverchan_push.py 用 SC_GG_BRIEF_KEY 读取)
BRIEF_KEY = "b7a28015f4445849cd8dc6aa71aebf3d"

# 条目存储:D1(SQLite,强一致;KV 最终一致性曾导致上传后查不到)
[[d1_databases]]
binding = "DB"
database_name = "gugugaga-db"
database_id = "b21d8bcd-1383-4eda-9a14-3f9a5ea4a1d3"

