name = "gugugaga"
compatibility_date = "2026-08-10"
pages_build_output_dir = "public"

# 真实绑定:KV id 来自 `wrangler kv namespace create`;R2 bucket 需先在 dashboard 启用
[[kv_namespaces]]
binding = "ENTRIES"
id = "73d4fb83273a49be907778313fa23164"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gugugaga-photos"

# 登录白名单(逗号分隔;密码不预置,首次登录凭一次性设置码自助设置,哈希存 D1 users 表)
# 密钥类配置已移出本文件:
#   - 本地开发:同值写入 .dev.vars(已 gitignore)
#   - 生产环境:以 Cloudflare Secrets 存放(`wrangler secret put SESSION_SECRET` 等,勿写进公开仓库)
#   变量名:SESSION_SECRET / AMAP_KEY / AMAP_SECURITY / AMAP_WEB_KEY / BRIEF_KEY
[vars]
USERS = "球,小红"
# 微信推送(WxPusher 第三方服务,无需自建公众号/企业资质):
# 用平时不用的微信号登录 https://wxpusher.zjiecode.com 注册应用拿到 AppToken(AT_ 开头)
# 家人扫码关注应用(或主题)拿到接收身份;topic 与 uids 二选一,topic 优先
# WXPUSHER_APPTOKEN = "AT_xxxxxxxxxxxxxxxxxxxxxxxx"
# WXPUSHER_TOPIC_ID = ""            # 可选:主题 ID,家人扫码关注主题后群发
# WXPUSHER_UIDS = ""                # 可选:接收人 UID,逗号分隔(与 topic 二选一)

# 条目存储:D1(SQLite,强一致;KV 最终一致性曾导致上传后查不到)
[[d1_databases]]
binding = "DB"
database_name = "gugugaga-db"
database_id = "b21d8bcd-1383-4eda-9a14-3f9a5ea4a1d3"

