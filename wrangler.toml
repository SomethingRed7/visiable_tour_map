name = "gugugaga"
compatibility_date = "2026-08-10"
pages_build_output_dir = "public"

# 真实绑定:KV id 来自 `wrangler kv namespace create`;R2 bucket 需先在 dashboard 启用
[[kv_namespaces]]
binding = "ENTRIES"
id = "73d4fb83273a49be907778313fa23164"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gugugaga-photos"

# 删除口令(4 位 PIN,上传无需口令;repo 为 private)
[vars]
DELETE_PASS = "2026"
# 高德开放平台 key(定位/地理编码;留空=纯浏览器定位+OSM 回退)
# AMAP_KEY = Web端(JS API)key —— 前端定位(AMap.Geolocation),白名单 gugugaga-viw.pages.dev
# AMAP_WEB_KEY = Web服务 key —— 服务端 regeo(restapi.amap.com),无需白名单
AMAP_KEY = "c89c48432f7c8a0f2408cffc4a535d15"
AMAP_WEB_KEY = ""

# 条目存储:D1(SQLite,强一致;KV 最终一致性曾导致上传后查不到)
[[d1_databases]]
binding = "DB"
database_name = "gugugaga-db"
database_id = "b21d8bcd-1383-4eda-9a14-3f9a5ea4a1d3"
